name: Build librespot binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: spoton
  SOURCE_DIR: librespot-spoton

jobs:
  detect-changes:
    name: Detect Rust source changes
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.check.outputs.rust_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Rust source changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch detected — forcing full build"
            RUST_CHANGED=true
          else
            PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
            if [ -z "$PREV_TAG" ]; then
              echo "No previous tag found — forcing full build"
              RUST_CHANGED=true
            else
              echo "Previous tag: $PREV_TAG"
              CHANGED=$(git diff --name-only "$PREV_TAG" "$GITHUB_REF_NAME" -- librespot-spoton/ | head -1)
              if [ -n "$CHANGED" ]; then
                RUST_CHANGED=true
              else
                RUST_CHANGED=false
              fi
            fi
          fi
          echo "Rust changed: $RUST_CHANGED"
          echo "rust_changed=$RUST_CHANGED" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            bin_dir: x86_64-linux
            use_cross: true
          - target: aarch64-unknown-linux-musl
            bin_dir: aarch64-linux
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            bin_dir: armhf-linux
            use_cross: true
          - target: arm-unknown-linux-musleabi
            bin_dir: arm-linux
            use_cross: true
          - target: i686-unknown-linux-musl
            bin_dir: i386-linux
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          EXT="${{ matrix.binary_ext }}"
          BINARY_PATH="${{ env.SOURCE_DIR }}/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${EXT}"
          DEST_DIR="Plugins/SpotOn/Bin/${{ matrix.bin_dir }}"
          mkdir -p "$DEST_DIR"
          cp "$BINARY_PATH" "$DEST_DIR/${{ env.BINARY_NAME }}${EXT}"
          chmod 755 "$DEST_DIR/${{ env.BINARY_NAME }}${EXT}"
          # Remove .gitkeep if present (binary replaces placeholder)
          rm -f "$DEST_DIR/.gitkeep"

      - name: Verify binary
        run: |
          EXT="${{ matrix.binary_ext }}"
          BINARY="Plugins/SpotOn/Bin/${{ matrix.bin_dir }}/${{ env.BINARY_NAME }}${EXT}"
          echo "=== Binary info ==="
          file "$BINARY"
          echo "=== Binary size ==="
          ls -la "$BINARY"
          echo "=== SHA256 checksum ==="
          sha256sum "$BINARY"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoton-${{ matrix.bin_dir }}
          path: Plugins/SpotOn/Bin/${{ matrix.bin_dir }}/spoton${{ matrix.binary_ext }}
          retention-days: 30

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release

      - name: Verify binary
        run: |
          $binary = "${{ env.SOURCE_DIR }}\target\release\${{ env.BINARY_NAME }}.exe"
          Write-Host "=== Binary info ==="
          Get-Item $binary | Select-Object Name, Length
          Write-Host "=== SHA256 ==="
          Get-FileHash $binary -Algorithm SHA256 | Select-Object Hash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoton-x86_64-win64
          path: ${{ env.SOURCE_DIR }}/target/release/${{ env.BINARY_NAME }}.exe
          retention-days: 30

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          BINARY_PATH="${{ env.SOURCE_DIR }}/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          chmod 755 "$BINARY_PATH"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoton-${{ matrix.arch }}-darwin
          path: ${{ env.SOURCE_DIR }}/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          retention-days: 30

  lipo:
    name: Create macOS Universal Binary
    runs-on: macos-15
    needs: build-macos

    steps:
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: spoton-aarch64-darwin
          path: arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: spoton-x86_64-darwin
          path: x86_64

      - name: Create Universal Binary
        run: |
          lipo -create -output spoton arm64/${{ env.BINARY_NAME }} x86_64/${{ env.BINARY_NAME }}
          chmod 755 spoton

      - name: Ad-hoc code sign
        run: codesign --force --sign - spoton

      - name: Verify Universal Binary
        run: |
          echo "=== lipo -info ==="
          lipo -info spoton
          echo "=== file ==="
          file spoton
          echo "=== codesign -dv ==="
          codesign -dv spoton 2>&1
          echo "=== SHA256 ==="
          shasum -a 256 spoton

      - name: Upload Universal Binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoton-darwin
          path: spoton
          retention-days: 30

  # CR-02: built HERE (not in the independent build-fake-libpulse.yml
  # workflow) so the `release` job below can download its artifacts via
  # actions/download-artifact@v4 -- that action only sees artifacts from
  # its OWN workflow run, never a separate workflow's run. D-06 requires
  # libpulse.so.0 to ship inside the plugin zip; a separate workflow made
  # that structurally impossible. build-fake-libpulse.yml itself is kept
  # for on-demand/manual builds (workflow_dispatch only, no longer runs
  # on tag push) so this matrix is not duplicated on every release.
  build-fake-libpulse:
    name: Build fake-libpulse ${{ matrix.bin_dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin_dir: x86_64-linux
            cc: gcc
            cross_gcc_package: ''
          - bin_dir: aarch64-linux
            cc: aarch64-linux-gnu-gcc
            cross_gcc_package: gcc-aarch64-linux-gnu
          - bin_dir: armhf-linux
            cc: arm-linux-gnueabihf-gcc
            cross_gcc_package: gcc-arm-linux-gnueabihf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install glibc cross-toolchain
        if: matrix.cross_gcc_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_gcc_package }}

      - name: Build libpulse.so.0
        run: |
          make -C Plugins/SpotOn/Bin/fake-libpulse CC=${{ matrix.cc }}

      - name: Prepare binary
        run: |
          DEST_DIR="Plugins/SpotOn/Bin/${{ matrix.bin_dir }}"
          mkdir -p "$DEST_DIR"
          cp Plugins/SpotOn/Bin/fake-libpulse/libpulse.so.0 "$DEST_DIR/libpulse.so.0"
          chmod 755 "$DEST_DIR/libpulse.so.0"

      - name: Verify binary (glibc, not musl -- Pitfall 3)
        run: |
          BINARY="Plugins/SpotOn/Bin/${{ matrix.bin_dir }}/libpulse.so.0"
          echo "=== Binary info ==="
          file "$BINARY"
          echo "=== SHA256 checksum ==="
          sha256sum "$BINARY"

          # WR-04: `file` on a shared object prints no libc identifier at
          # all (verified empirically -- interpreter strings only exist
          # in executables, not .so files), so a `file | grep -qi musl`
          # guard can never actually catch a musl-linked .so. Inspect the
          # dynamic section's NEEDED entries instead: musl links produce
          # `NEEDED libc.so`, glibc produces `NEEDED libc.so.6`.
          echo "=== readelf -d NEEDED entries ==="
          readelf -d "$BINARY" | grep NEEDED

          if readelf -d "$BINARY" | grep -q 'NEEDED.*\[libc\.so\]'; then
            echo "FATAL: $BINARY was linked against musl libc (NEEDED libc.so, no .6)." >&2
            echo "Soloist is a glibc binary -- a musl fake-libpulse.so.0" >&2
            echo "will fail to load via LD_LIBRARY_PATH (dynamic loader" >&2
            echo "mismatch). Check that CC=${{ matrix.cc }} resolved to" >&2
            echo "a glibc cross-toolchain, not a musl one." >&2
            exit 1
          fi
          if ! readelf -d "$BINARY" | grep -q 'NEEDED.*libc\.so\.6'; then
            echo "FATAL: expected glibc NEEDED entry (libc.so.6) not found in $BINARY." >&2
            exit 1
          fi
          echo "glibc verification passed (NEEDED libc.so.6 present, no musl libc.so)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-libpulse-${{ matrix.bin_dir }}
          path: Plugins/SpotOn/Bin/${{ matrix.bin_dir }}/libpulse.so.0
          retention-days: 30

  reuse-binaries:
    name: Reuse binaries from previous release
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust_changed == 'false'
    permissions:
      contents: read

    steps:
      - name: Find previous release tag
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --json tagName --jq '.[].tagName' | grep '^v' | grep -v "^${CURRENT_TAG}$" | head -1)
          echo "Downloading binaries from $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Download binaries from previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.prev.outputs.prev_tag }}" --repo "$GITHUB_REPOSITORY" -p 'spoton-*' -D prev-binaries/

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/{x86_64-linux,aarch64-linux,armhf-linux,arm-linux,i386-linux,x86_64-win64,darwin}
          cp prev-binaries/spoton-x86_64-linux artifacts/x86_64-linux/spoton
          cp prev-binaries/spoton-aarch64-linux artifacts/aarch64-linux/spoton
          cp prev-binaries/spoton-armhf-linux artifacts/armhf-linux/spoton
          cp prev-binaries/spoton-arm-linux artifacts/arm-linux/spoton
          cp prev-binaries/spoton-i386-linux artifacts/i386-linux/spoton
          cp prev-binaries/spoton-x86_64-win64.exe artifacts/x86_64-win64/spoton.exe
          cp prev-binaries/spoton-darwin artifacts/darwin/spoton
          chmod 755 artifacts/*/spoton*

      - name: Upload spoton-x86_64-linux
        uses: actions/upload-artifact@v4
        with:
          name: spoton-x86_64-linux
          path: artifacts/x86_64-linux/spoton
          retention-days: 30

      - name: Upload spoton-aarch64-linux
        uses: actions/upload-artifact@v4
        with:
          name: spoton-aarch64-linux
          path: artifacts/aarch64-linux/spoton
          retention-days: 30

      - name: Upload spoton-armhf-linux
        uses: actions/upload-artifact@v4
        with:
          name: spoton-armhf-linux
          path: artifacts/armhf-linux/spoton
          retention-days: 30

      - name: Upload spoton-arm-linux
        uses: actions/upload-artifact@v4
        with:
          name: spoton-arm-linux
          path: artifacts/arm-linux/spoton
          retention-days: 30

      - name: Upload spoton-i386-linux
        uses: actions/upload-artifact@v4
        with:
          name: spoton-i386-linux
          path: artifacts/i386-linux/spoton
          retention-days: 30

      - name: Upload spoton-x86_64-win64
        uses: actions/upload-artifact@v4
        with:
          name: spoton-x86_64-win64
          path: artifacts/x86_64-win64/spoton.exe
          retention-days: 30

      - name: Upload spoton-darwin
        uses: actions/upload-artifact@v4
        with:
          name: spoton-darwin
          path: artifacts/darwin/spoton
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-changes, build, build-windows, lipo, reuse-binaries, build-fake-libpulse]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && !failure()
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Remove intermediate macOS artifacts
        run: |
          rm -rf release-artifacts/spoton-aarch64-darwin
          rm -rf release-artifacts/spoton-x86_64-darwin

      - name: Flatten binaries with platform suffix
        run: |
          mkdir -p release-flat
          for dir in release-artifacts/spoton-*/; do
            name=$(basename "$dir")
            if [ -f "$dir/spoton.exe" ]; then
              cp "$dir/spoton.exe" "release-flat/${name}.exe"
            elif [ -f "$dir/spoton" ]; then
              cp "$dir/spoton" "release-flat/$name"
            fi
          done
          ls -la release-flat/

      - name: Assemble plugin zip
        run: |
          for dir in release-artifacts/spoton-*/; do
            bin_dir=$(basename "$dir" | sed 's/^spoton-//')
            dest="Plugins/SpotOn/Bin/$bin_dir"
            mkdir -p "$dest"
            cp "$dir"/* "$dest/"
            chmod 755 "$dest"/*
            rm -f "$dest/.gitkeep"
          done

          # CR-02/D-06: fold in the fake-libpulse.so.0 stub built by the
          # build-fake-libpulse job (same workflow run, so
          # actions/download-artifact@v4 above can see it) into the same
          # Bin/<arch>/ directories the librespot binaries just landed in.
          for dir in release-artifacts/fake-libpulse-*/; do
            bin_dir=$(basename "$dir" | sed 's/^fake-libpulse-//')
            dest="Plugins/SpotOn/Bin/$bin_dir"
            mkdir -p "$dest"
            cp "$dir/libpulse.so.0" "$dest/libpulse.so.0"
            chmod 755 "$dest/libpulse.so.0"
          done

          VERSION="${GITHUB_REF_NAME}"
          zip -r "release-flat/SpotOn-${VERSION}.zip" Plugins/SpotOn/
          echo "=== Plugin zip ==="
          ls -lh "release-flat/SpotOn-${VERSION}.zip"
          echo "=== SHA1 for repo.xml ==="
          sha1sum "release-flat/SpotOn-${VERSION}.zip"

      - name: Create checksums
        run: |
          cd release-flat
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract section between this version header and the next version header
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-flat/*
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
