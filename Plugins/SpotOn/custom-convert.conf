soc pcm * *
	# I
	-

son ogg * *
	# I
	-

sol flc * *
	# R
	[spoton-soloist] --single-track $URL$ 2>/dev/null | [flac] -cs --channels=2 --sample-rate=44100 --bps=24 --endian=little --sign=signed --fast --totally-silent --ignore-chunk-sizes -

sol pcm * *
	# R
	[spoton-soloist] --single-track $URL$ 2>/dev/null
