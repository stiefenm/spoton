soc pcm * *
	# I
	-

son ogg * *
	# I
	-

# Phase 74b D-01/D-14: dedicated FLAC forcing type. sof has exactly this
# ONE rule, the same single-rule idiom as son (ogg-only) and smp
# (mp3-only): TranscodingHelper picks the output format by iterating the
# PLAYER's format-preference order (TranscodingHelper.pm:352-396), so a
# second rule under soc would let that order decide instead of the user.
# soc therefore stays the pure PCM type with its one passthrough rule
# above, and ProtocolHandler's contentTypeFor (via formatOverride) maps
# every per-player choice to exactly one of soc, sof, smp, son.
# $SAMPLESIZE$ substitutes the source bit depth from
# `$track->samplesize || 16` (TranscodingHelper.pm:449): Soloist streams
# are hinted 32 in ProtocolHandler.pm, librespot streams rely on the 16
# default, so 16-bit librespot input is padded losslessly (D-04). The
# output is 16-bit FLAC without dither (D-01): a zero low half stays
# bit-identical, anything else is rounded, so no bit-exact claim is made
# (D-21). The LMS-bundled [sox] performs the raw-to-FLAC conversion; never
# invoke the flac binary directly for raw input (the bundled flac 1.3.4
# rejects high-bps raw input). -C 0 = fastest compression, standard for
# live rules. Only the I capability: the daemon seeks itself and the
# bundled tool does not take the seek options of the flac binary.
sof flc * *
	# I
	[sox] -q -t raw --encoding signed-integer --bits $SAMPLESIZE$ --endian little -r 44100 -c 2 - -t flac -C 0 -b 16 -D -

# Phase 76 D-07: dedicated MP3 forcing type. TranscodingHelper picks the
# output format by iterating the PLAYER's format-preference order
# (TranscodingHelper.pm:352-386) -- under 'soc', flc always beats mp3 on
# flc-capable players, so a 'soc mp3' rule could never win there. 'smp'
# has exactly this ONE rule, so profile matching can only land on MP3
# (same forcing idiom as the ogg-only 'son'). ProtocolHandler's
# formatOverride returns 'smp' for an explicit per-player streamFormat=mp3
# (both backends). $SAMPLESIZE$ substitutes the source bit depth (soloist
# raw S32 streams hint 32 in ProtocolHandler.pm; librespot defaults to 16
# via TranscodingHelper.pm:449) so [lame] decodes the raw input correctly.
# The [lame] token makes LMS disable this rule when the [lame] binary (a
# system package, not LMS-bundled) is absent -- there is deliberately NO
# 'smp pcm' fallback rule: with [lame] missing, getConvertCommand2 finds
# no usable smp profile and LMS surfaces a visible stream error
# (PROBLEM_CONVERT_FILE, Song.pm:425-427) instead of silently playing a
# different format than the user explicitly chose.
smp mp3 * *
	# IFB:{BITRATE=--abr %B}
	[lame] --silent -r --little-endian --signed --bitwidth $SAMPLESIZE$ -s 44.1 -q 2 $BITRATE$ - -
