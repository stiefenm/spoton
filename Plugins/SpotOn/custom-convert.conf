soc pcm * *
	# I
	-

son ogg * *
	# I
	-

# Phase 76 D-05: FLAC 24-bit for flc-capable players (e.g. squeezelite).
# soc is SHARED between soloist (raw S32LE after the D-04 fake-libpulse
# upgrade) and librespot Connect/browse PCM (raw S16LE). $SAMPLESIZE$
# substitutes from `$track->samplesize || 16` (TranscodingHelper.pm:449):
# soloist streams are hinted 32 in ProtocolHandler.pm, librespot streams
# rely on the 16 default -- both transcode correctly through the same
# rule. -b 24 output is constant: 32-bit input truncates only float
# rounding noise (lossless in practice, the source is <=24-bit), 16-bit
# input pads losslessly. The LMS-bundled [sox] performs the raw-to-FLAC
# conversion; never invoke the flac binary directly for raw input (the
# bundled flac 1.3.4 rejects high-bps raw input -- 76-RESEARCH
# Anti-Patterns). -C 0 = fastest compression, standard for live rules.
soc flc * *
	# IFT:{START=--skip=%t}U:{END=--until=%v}
	[sox] -q -t raw --encoding signed-integer --bits $SAMPLESIZE$ --endian little -r 44100 -c 2 - -t flac -C 0 -b 24 -

# Phase 76 D-07: dedicated MP3 forcing type. TranscodingHelper picks the
# output format by iterating the PLAYER's format-preference order
# (TranscodingHelper.pm:352-386) -- under 'soc', flc always beats mp3 on
# flc-capable players, so a 'soc mp3' rule could never win there. 'smp'
# has exactly this ONE rule, so profile matching can only land on MP3
# (same forcing idiom as the ogg-only 'son'). ProtocolHandler's
# formatOverride returns 'smp' for an explicit per-player streamFormat=mp3
# (both backends). $SAMPLESIZE$ substitutes the source bit depth (soloist
# raw S32 streams hint 32 in ProtocolHandler.pm; librespot defaults to 16
# via TranscodingHelper.pm:449) so [lame] decodes the raw input correctly.
# The [lame] token makes LMS disable this rule when the [lame] binary (a
# system package, not LMS-bundled) is absent -- there is deliberately NO
# 'smp pcm' fallback rule: with [lame] missing, getConvertCommand2 finds
# no usable smp profile and LMS surfaces a visible stream error
# (PROBLEM_CONVERT_FILE, Song.pm:425-427) instead of silently playing a
# different format than the user explicitly chose.
smp mp3 * *
	# IFB:{BITRATE=--abr %B}
	[lame] --silent -r --little-endian --signed --bitwidth $SAMPLESIZE$ -s 44.1 -q 2 $BITRATE$ - -
