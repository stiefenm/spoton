#########################################################################
#ID     Suffix          Mime Content-Type               Server File Type#
#########################################################################
# The MIME column here MUST stay SpotOn-specific (audio/x-sb-spoton-*).
# LMS resolves a remote stream's type from its Content-Type header via
# last-plugin-row-wins (Slim::Music::Info %mimeTypes); a standard MIME in
# this file hijacks EVERY internet radio stream of that format server-wide.
son	son	audio/x-sb-spoton-ogg	audio
soc	soc	audio/x-sb-spoton-connect	audio
smp	smp	audio/x-sb-spoton-mp3	audio
sof	sof	audio/x-sb-spoton-flac	audio
